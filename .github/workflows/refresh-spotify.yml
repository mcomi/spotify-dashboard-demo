name: Refresh Spotify Snapshot

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        env:
          REFRESH_URL: ${{ secrets.SPOTIFY_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$REFRESH_URL" \
            -H "Authorization: Bearer $CRON_SECRET"
